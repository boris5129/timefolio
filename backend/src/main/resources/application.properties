server.address=${TIMEFOLIO_BIND:127.0.0.1}
server.port=${TIMEFOLIO_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${TIMEFOLIO_DB_URL}
spring.datasource.username=${TIMEFOLIO_DB_USER}
spring.datasource.password=${TIMEFOLIO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.web.resources.static-locations=file:${TIMEFOLIO_FRONTEND:../frontend/dist}/,classpath:/static/
